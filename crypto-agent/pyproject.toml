[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "cryptoagent"
version = "1.0.0"
description = "Agente de análisis continuo del mercado cripto (técnico, momentum, velas, estructura y posicionamiento de derivados)"
requires-python = ">=3.11"

[project.scripts]
cryptoagent = "cryptoagent.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.setuptools.package-data]
cryptoagent = ["api/static/*"]
